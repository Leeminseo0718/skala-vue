# main 에 푸시될 때마다 빌드해서 GitHub Pages 에 올린다.
# 저장소 Settings → Pages → Source 를 'GitHub Actions' 로 바꿔 두어야 동작한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 필요할 때 Actions 탭에서 손으로도 돌릴 수 있게 열어 둔다
  workflow_dispatch:

# Pages 에 올리기 위해 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 남긴다 (진행 중인 건 취소하지 않는다)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        # .env 는 저장소에 없으므로 키는 저장소 Secret 에서 주입한다.
        # 키가 없어도 빌드는 되고, 앱은 저장된 목 데이터로 동작한다.
        env:
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
        run: npm run build

      - name: SPA 새로고침 대비
        # GitHub Pages 는 /weather/city_01 같은 주소를 파일로 찾다가 404 를 낸다.
        # index.html 을 404.html 로 복사해 두면 그 경로도 앱이 받아 라우터가 처리한다.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
